name: "CI/CD Pipeline"

on:
  push:
    branches:
      - 'main'
      - 'release/**'

env:
  registry_url: "registry.hub.docker.com"
  image_repo: "kvendingoldo/mks-bot"

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.set_version.outputs.safe_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # ratchet:docker/setup-qemu-action@v4
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # ratchet:docker/setup-buildx-action@v4

      - name: Login to Docker registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # ratchet:docker/login-action@v4
        with:
          registry: ${{ env.registry_url }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Set application version
        id: set_version
        uses: kvendingoldo/git-flow-action@ca756ba150c376eb9bf35e3ff3ed591913bb7f11 # ratchet:kvendingoldo/git-flow-action@v2.16.0
        with:
          enable_github_release: true
          auto_release_branches: "main"
          tag_prefix_release: "v"
          github_token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # ratchet:docker/build-push-action@v7
        with:
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ${{ env.registry_url }}/${{ env.image_repo }}:latest
            ${{ env.registry_url }}/${{ env.image_repo }}:${{ steps.set_version.outputs.safe_version }}

      - name: Print image version
        run: echo ${{ steps.set_version.outputs.safe_version }}

  deploy:
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # ratchet:appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            docker ps
            docker rm -f mks-bot
            docker run -d --name=mks-bot -e MKS_API_TOKEN=${{ secrets.MKS_API_TOKEN }} -e TG_BOT_TOKEN=${{ secrets.TG_BOT_TOKEN }} ${{ env.registry_url }}/${{ env.image_repo }}:${{ needs.build.outputs.version }}
